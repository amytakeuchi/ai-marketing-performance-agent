marketing_dw:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | as_number }}"
      user: "{{ env_var('PG_ADMIN_USER', 'postgres') }}"
      password: "{{ env_var('PG_ADMIN_PASSWORD', 'postgres') }}"
      dbname: "{{ env_var('PGDATABASE', 'marketing_dw') }}"
      schema: public
      threads: 4
