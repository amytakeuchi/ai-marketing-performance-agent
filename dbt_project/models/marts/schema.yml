version: 2

models:
  - name: dim_campaign
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]
      - name: platform
        data_tests:
          - accepted_values:
              arguments: {values: ["Meta Ads", "Google Ads", "Non-paid"]}
  - name: dim_landing_page
    columns:
      - name: landing_page_id
        data_tests: [unique, not_null]
  - name: dim_customer
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: acquisition_campaign_id
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_campaign')", field: campaign_id}
  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: fact_ad_performance
    data_tests:
      - unique_combination:
          arguments: {columns: [date_day, campaign_id]}
    columns:
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: "ref('dim_campaign')", field: campaign_id}
      - name: spend
        data_tests: [not_null]

  - name: fact_web_analytics
    data_tests:
      - unique_combination:
          arguments: {columns: [date_day, campaign_id, landing_page_id, device]}
    columns:
      - name: device
        data_tests:
          - accepted_values:
              arguments: {values: ["mobile", "desktop"]}
      - name: landing_page_id
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_landing_page')", field: landing_page_id}

  - name: fact_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: campaign_id
        data_tests:
          - relationships:
              arguments: {to: "ref('dim_campaign')", field: campaign_id}
      - name: revenue
        data_tests: [not_null]

  - name: mart_campaign_daily
    description: "Semantic-layer source. One row per date x campaign."
    data_tests:
      - unique_combination:
          arguments: {columns: [date_day, campaign_id]}
